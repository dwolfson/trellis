[project]
name = "trellis-artifact-tree"
version = "0.1.0"
description = "Shared containment tree over ingested artifacts — the structure retrieval chunks and compression rungs are both cut from. Owned by neither app: Resource Explorer and Egeria Advisor each run their own ingestion pipeline (a confirmed divergence, see docs/ingestion-pipeline-audit.md item 3) and so both PRODUCE trees, which a read-only cross-schema pattern cannot serve. See docs/context-compilation-design.md §15."
readme = "README.md"
authors = [{ name = "Dan Wolfson" }]
requires-python = ">=3.12,<4.0"
dependencies = [
    "psycopg2-binary>=2.9.0",
]

# Deliberately NOT dependencies, matching trellis-vectorstore's stance:
#
# - pydantic / pydantic-settings: this package never reads the environment.
#   Each app resolves its own config and builds ArtifactTreeConfig as the last
#   step. A third config surface racing the two that exist would not be a fix.
# - pgvector / numpy: embeddings are NOT this package's business. The tree
#   holds structure; vectors live in trellis-vectorstore. They share one
#   Postgres, so a leaf node joins to its chunk in a single query without
#   either package knowing about the other's tables.
# - any parser, tree-sitter, or document library: NOT core dependencies, but see
#   the optional extras below. An earlier version of this file said adapters
#   "live in the apps" -- that rule was vacuous. Both RE and EA already depend
#   on docling AND tree-sitter (EA: docling>=1.0.0, tree-sitter>=0.23.0; RE:
#   docling>=2.0.0, tree-sitter>=0.21), so "the app that already depends on it"
#   names both apps and routes nothing. Applying it would have duplicated the
#   same parser in two places, which is what the shared-package pattern exists
#   to avoid. Code and PDF are common to both apps, so their adapters belong
#   here -- behind extras, so a consumer wanting only the model and store pays
#   for neither.

[project.optional-dependencies]
# Install what you parse. `pip install trellis-artifact-tree` gets the model,
# store, registry, markdown and the generic fallback -- all stdlib -- and
# nothing else.
code = [
    "tree-sitter>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
]
pdf = [
    "docling>=2.0.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trellis_artifact_tree"]

[project]
name = "trellis-querycache"
version = "0.1.0"
description = "Shared TTL/LRU query cache with an optional Redis backend — extracted from resource-explorer and egeria-advisor, which had independently grown caches with the same purpose and different behaviour (EA's was documented and named as LRU throughout but evicted FIFO). See docs/re-ea-consolidation-audit.md item 1."
readme = "README.md"
authors = [{ name = "Dan Wolfson" }]
requires-python = ">=3.12,<4.0"
dependencies = []

# Deliberately NO dependencies, mirroring trellis-vectorstore's stance:
#   - no pydantic/pydantic-settings — QueryCacheConfig is a plain frozen
#     dataclass and this package never reads the environment itself; each app
#     resolves its own env/YAML into it.
#   - no loguru — stdlib `logging` only, so the package imports cleanly in any
#     host. Each app already configures its own sink.
#   - no redis — the Redis backend is imported lazily and only when an app
#     actually configures backend="redis". Apps that want it declare it.

[project.optional-dependencies]
redis = ["redis>=5.0.0"]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trellis_querycache"]

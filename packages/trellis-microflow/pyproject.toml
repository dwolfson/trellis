[project]
name = "trellis-microflow"
version = "0.1.0"
description = "Shared microflow resource-sharing primitives — the generic half of resource-explorer's D6 design (docs/unified-survey-execution-model-plan.md), extracted from the start rather than after independent duplication (the lesson trellis-vectorstore's own extraction already taught in this workspace)."
readme = "README.md"
authors = [{ name = "Dan Wolfson" }]
requires-python = ">=3.12,<4.0"
dependencies = []

# Deliberately zero dependencies: this package is a pure orchestration
# primitive (a dataclass + one small function operating on stdlib
# contextlib types). Every domain-specific piece — what a "project" is,
# what a "registry" is, how to actually download a zipball — stays in the
# app that uses this package; ResourceProvider.acquire is a zero-argument
# callable precisely so this package never needs to know about any of
# that (see trellis_microflow/resources.py's own docstring).

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trellis_microflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]

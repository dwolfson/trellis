[project]
name = "trellis-accel"
version = "0.1.0"
description = "One device choice (NVIDIA/AMD GPU, Apple GPU, CPU) for every Trellis model, and a start-up report of what the machine has against what the installed PyTorch can use. docs/hardware-acceleration-proposal.md."
readme = "README.md"
authors = [{ name = "Dan Wolfson" }]
requires-python = ">=3.12,<4.0"
# No dependencies, deliberately: torch is imported only when asked, and never installed by this package, so
# depending on trellis-accel can never pull a multi-gigabyte PyTorch build into an environment.
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trellis_accel"]

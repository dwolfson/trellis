[project]
name = "trellis-vectorstore"
version = "0.1.0"
description = "Shared pgvector-backed vector store — extracted from resource-explorer and egeria-advisor, which had independently converged on structurally similar but behaviorally distinct PgVectorStore implementations. See docs/trellis-vectorstore-extraction.md."
readme = "README.md"
authors = [{ name = "Dan Wolfson" }]
requires-python = ">=3.12,<4.0"
dependencies = [
    "psycopg2-binary>=2.9.0",
    "pgvector>=0.3.0",
    "numpy>=1.26.0",
]

# Deliberately NOT a dependency: pydantic/pydantic-settings, loguru,
# sentence-transformers. This package never reads the environment itself
# (PgVectorStoreConfig is a plain frozen dataclass — each app resolves its
# own env/YAML into it) and never computes embeddings itself (the
# EmbeddingProvider Protocol is satisfied by a small adapter each app
# already owns) — see trellis_vectorstore/config.py and embeddings.py.

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trellis_vectorstore"]

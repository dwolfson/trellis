[project]
name = "trellis-step-re-statistics-freshness"
dynamic = ["version"]
description = "Analytic Library step: how old each table's planner statistics are (last ANALYZE and VACUUM), from the activity snapshot RE stored. Installable on its own; installing it is registering it."
requires-python = ">=3.12,<4.0"
dependencies = ["trellis-analytics>=0.1.0"]

# Installation is registration: Resource Explorer finds the step through this entry point.
[project.entry-points."trellis.analytics"]
re_statistics_freshness = "re_statistics_freshness.manifest:MANIFEST"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/re_statistics_freshness/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/re_statistics_freshness"]

# In this repo the library is the sibling package, three levels up; outside it, trellis-analytics comes from
# wherever the host installed it. pip ignores this table.
[tool.uv.sources]
trellis-analytics = { path = "../../..", editable = true }

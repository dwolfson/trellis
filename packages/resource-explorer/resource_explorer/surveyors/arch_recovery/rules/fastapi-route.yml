# design §5.1 "Web framework markers" — a route registration is evidence for a
# SolutionPort with direction Input-Output (§3.2: serving an interface, not
# calling one).
#
# VERIFIED against a real parse tree, and the first draft was badly wrong.
# It matched the CALL form (`$APP.get($PATH, $$$ARGS)`) on the theory that
# over-matching was acceptable at Phase 0's confidence ceiling — "e.g. a dict
# named `router` with a `.get` method". Measured, that theory understated the
# damage by an order of magnitude: 620 matches across resource_explorer,
# almost all of them `dict.get(key, default)` — one of the commonest idioms in
# Python. Top-matching file was `cli/main.py` (38), which registers no routes
# at all.
#
# Routes are DECORATORS, not calls. Matching the decorator form finds 145
# real registrations and no dict lookups. The lesson generalises: a code
# marker must match the syntactic form the framework actually uses, and
# "over-matching is acceptable" is a claim to measure, never to assume.
#
# Second-order version of the same lesson, found 2026-09-03 against sqlglot
# (a repo this codebase's own measurement above never ran against):
# `@$APP.patch($$$ARGS)` matches `@mock.patch(...)`/`@mocker.patch(...)` —
# unittest.mock's/pytest-mock's decorator, one of the most common test-suite
# idioms in Python, completely unrelated to an HTTP PATCH route. Verified
# directly: sqlglot's test suite (no FastAPI dependency at all) tripped
# "Software Service" at 70% confidence on `tests`/`tests/dialects` purely
# from `@mock.patch("sqlglot.parser.logger")`-style decorators. `.get`/
# `.post`/`.put`/`.delete`/`.websocket` don't share this collision (no
# equally common stdlib/pytest method by those exact names on an object
# named `mock`/`mocker`) — only `.patch` needed the constraint.
id: fastapi-route-registration
language: Python
rule:
  any:
    - pattern: "@$APP.get($$$ARGS)"
    - pattern: "@$APP.post($$$ARGS)"
    - pattern: "@$APP.put($$$ARGS)"
    - pattern: "@$APP.delete($$$ARGS)"
    - pattern: "@$APP.patch($$$ARGS)"
    - pattern: "@$APP.websocket($$$ARGS)"
constraints:
  APP:
    not:
      regex: "^(mock|mocker|unittest\\.mock)$"

# pyegeria OMVS client class -> Egeria view service, curated from the
# installed pyegeria package (measured 2026-09-14 against
# .venv/lib/python3.13/site-packages/pyegeria/omvs/*.py).
#
# WHY THIS FILE EXISTS — same shape of problem as dependency_support.yaml's
# header: a repository "consumes an Egeria interface" by IMPORTING AND
# INSTANTIATING one of these classes, and neither fact is captured anywhere
# zero-fetch can read. `project_code_symbols` (repo_symbol_extraction's own
# table) holds only symbol DEFINITIONS — classes/functions/methods the
# surveyed repo itself declares — never `import` statements and never call/
# instantiation sites. So `egeria_interfaces.py` cannot see "this repo does
# `from pyegeria.omvs import ClassificationExplorer`"; the closest zero-fetch
# signal is a symbol whose own SIGNATURE, RETURN TYPE, or base-class list
# (inheritance, from project_code_relationships) mentions one of these class
# names as a type reference — which undercounts real usage (a plain
# `self.client = ClassificationExplorer(...)` in `__init__` leaves no trace
# at all in either table) and the classifier says so on every result via
# `basis`.
#
# `view_service` is the human name; derived here from each module's own REST
# path prefix (`/servers/{server}/api/open-metadata/<slug>`), title-cased.
# `view_service` is null for a class Egeria does not expose as a distinct
# view service under its own path — `RegisteredInfo`/`SolutionArchitect`
# reuse another view service's path (asset-catalog / metadata-expert
# respectively, both noted via `shares_path_with`), and
# `ValidMetadataLists`/`ValidTypeLists` are helper subclasses of
# `ValidMetadataManager`, mapped to the same view service as their parent.
#
# Excluded entirely (not client classes, or not view-service clients):
# core_omag_server_config, full_omag_server_config (server config, not a view
# service), platform_services/server_operations (platform/server admin
# clients, a different Egeria layer), specification_properties (a properties
# model, not a client).

client_classes:


  - Consumer
  - Data Expert
  - Security
  - Architecture
  - Admin
  answering:
    kind: gap
    analysis_ids: []
    note: 'GAP: RAG content read (API docs/integration guides) — no structured surveyor'
  answering_mechanism: RAG Queries
- question: Does this fit within or need to extend our existing infrastructure estate?
  stage: Analysis/Enrichment
  perspectives:

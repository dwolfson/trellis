- question: How much code is there? How complex?
  stage: Assessment
  perspectives:
  - App/AI Builder
  - Security
  - Architecture
  - Admin
  purposes:
  - Assess
  - Maintain
  answering:
    kind: analysis
    analysis_ids:
    - language_file_classification
    - api_structure
    checks: []
    note: language_file_classification + api_structure
  answering_mechanism: Code Analysis
  rationale: 'Both halves are answerable as of 2026-09-02. SIZE: language_file_classification carries
    a per-language line census — code, comment, docstring and blank — written at ingestion and at Coarse
    Profile refresh (pipeline.py::_record_line_census). Markdown, JSON, HTML, CSS, SQL and XML are counted
    as text and excluded from the code total by construction; project_stats.ingestion_lines_of_code, which
    counted every newline in every text file and reported 1,118,195 against ~156k real code lines on egeria-python,
    is retired and must not be cited. COMPLEXITY: api_structure carries the per-language max/mean it always
    computed, python and java only — go and javascript store 0 for every symbol because their extractors
    never compute it, so they are excluded and named rather than averaged in (0.32 vs 2.69 on milvus).
    A repo with no census reports no line counts rather than zero: not counted is not the same as no code.'

# Question checklist catalog — generated by
# scripts/csv_to_question_catalog_yaml.py from
# docs/dr-egeria/resource_questions.csv (the source of truth — edit that
# CSV, then regenerate this file, don't hand-edit it directly). Backs the
# Scouting "Questions" checklist tab (question_catalog_reader.py).
#
# Each entry:
#   question      - display text; matches the Egeria GlossaryTerm Display
#                   Name exactly (case+punctuation-sensitive) since it's
#                   also the join key back to Egeria's own Question
#                   elements, if/when RE ever queries them live.
#   stage         - single Funnel Stage this question belongs to (collapsed
#                   from the earlier separate Asked At/Answered At columns
#                   2026-08-14 — see docs/survey-question-context-plan.md).
#                   May be a slash-combined value (e.g. "Analysis/Enrichment")
#                   signaling an Analysis-first, Enrichment-fallback pattern
#                   (see docs/confidence-gated-validation-plan.md) — treated
#                   as a literal string match, not split, until that plan is
#                   built.
#   perspectives  - Perspective names this question is linked to.
#   purposes      - Purpose kinds this question serves (added 2026-08-24).
#                   Purpose is the PRIMARY dispatch axis and Perspective the
#                   secondary one: Perspective was measured and cannot
#                   discriminate (no perspective reaches an analysis another
#                   doesn't also reach). Purpose ORDERS what runs by default;
#                   it never excludes. See docs/investigation-framing-design.md.
#   answering:
#     kind        - "analysis" | "direct" | "registry" | "human" |
#                   "chart" | "gap" | "partial" | "mixed" | "unknown" —
#                   how (or whether) RE can answer this today.
#     analysis_ids - analysis_catalog.yaml repo_analyses ids that answer
#                   (fully or partially) this question; may be empty.
#     checks       - finer `analysis_id:check_name` refs, validated against
#                   configdata/check_registry.yaml. Added 2026-08-24 because
#                   analysis-level joins are too coarse to dispatch on (one
#                   analysis, repo_conventions, answers 7 of the 16
#                   analysis-answerable questions). Empty means "no check
#                   refs authored yet" — fall back to analysis_ids, do not
#                   read it as "no checks apply". A check ref implies its
#                   analysis, which is added to analysis_ids automatically.
#     note        - the CSV's "Answering Analysis" column, verbatim —
#                   human-readable detail (candidate tooling for gaps,
#                   which direct field/table, etc.).
#   answering_mechanism - the CSV's "Answering Mechanism" column, verbatim —
#                   which kind of engine answers this (Git Statistics /
#                   Code Analysis / RAG Queries / Agent-Based Analysis /
#                   Egeria Queries / Local Registry Query / Human-Supplied /
#                   Direct Field / Trend Chart / Gap / Automate Change
#                   Detection, or a "+"-joined combination) — orthogonal to
#                   stage and to answering.kind, added 2026-08-14.
#   rationale   - the CSV's "Rationale/Source" column, verbatim — what a
#                   question's answer CAN and CANNOT claim. secret_scan
#                   never claims "no secrets", only no matches against
#                   this ruleset in this snapshot; cve_scan sees declared
#                   dependencies only. These are the caveats that turn a
#                   finding into a claim, so they are carried to the UI
#                   rather than left in the CSV. Added 2026-09-11.

repo_questions:
- question: Is this repository actively maintained?
  stage: Scouting
  perspectives:
  - Steward
  - Consumer
  - Data Expert
  purposes:
  - Select
  - Maintain
  answering:
    kind: analysis
    analysis_ids:
    - repository_health
    - foss_scorecard
    checks:
    - foss_scorecard:maintained
    note: 'repository_health + foss_scorecard [checks: foss_scorecard:maintained]'
  answering_mechanism: Git Statistics + Code Analysis
  rationale: Recency/frequency signal — last-pushed date, commit cadence — answerable from GitHub API
    metadata alone (RE's HealthSurveyor), no zipball needed.
- question: What does this repository do?
  stage: Scouting
  perspectives:
  - Consumer
  - Data Expert
  - Architecture
  purposes:
  - Explore
  - Select
  - Learn
  answering:
    kind: direct
    analysis_ids: []
    checks: []
    note: N/A — direct field (Project.description) This might also be a summary of the top level README.
  answering_mechanism: Direct Field
  rationale: Purpose/description — from the repo's own GitHub description field, no deeper analysis required.
- question: Who maintains this repository?
  stage: Scouting
  perspectives:
  - Steward
  - Data Owner
  - Security
  purposes:
  - Explore
  - Select
  answering:
    kind: analysis
    analysis_ids:
    - repository_health
    - chaoss_metrics
    checks: []
    note: repository_health + chaoss_metrics (contributor identities and concentration)
  answering_mechanism: Git Statistics
  rationale: repository_health alone answers 'is it maintained', not 'by whom' — the two questions returned
    the same text until chaoss_metrics, built on project_commits, gave this one its own source.
- question: How widely adopted and active is the community around this repository?
  stage: Scouting
  perspectives:
  - Consumer
  - Community
  purposes:
  - Explore
  - Select
  answering:
    kind: analysis
    analysis_ids:
    - repository_health
    - community_support
    - chaoss_metrics
    checks: []
    note: repository_health + community_support (attention, participation and channels as separate dimensions,
      weakest named) + chaoss_metrics
  answering_mechanism: Git Statistics + Code Analysis
  rationale: Stars are attention, not community. community_support reports the dimensions separately and
    names the weakest rather than averaging, so 'popular but unsupported' stays visible instead of averaging
    out.
- question: Has this repository already been catalogued in Egeria and when?
  stage: Discovery
  perspectives:
  - Governance
  - Steward
  purposes:
  - Explore
  - Maintain
  answering:
    kind: direct
    analysis_ids: []
    checks: []
    note: 'N/A — direct field (is_published/egeria_asset_guid); GAP: known-inventory search across the
      Egeria catalog itself isn''t built (Scouting''s "shop for data" Track 1)'
  answering_mechanism: Egeria Queries
  rationale: '"Known inventory" check — is there already a SourceControlLibrary asset for this repo, independent
    of whether it''s registered in Resource Explorer''s own local registry. Ties to the Scouting "shop
    for data" search work.'
- question: Are there outstanding CVEs?
  stage: Analysis
  perspectives:
  - Governance
  - Security
  purposes:
  - Select
  - Assess
  - Certify
  - Maintain
  answering:
    kind: analysis
    analysis_ids:
    - cve_scan
    checks: []
    note: cve_scan
  answering_mechanism: External Service Query
  rationale: Closed 2026-08-26 by cve_scan, which queries OSV.dev for advisories against the dependencies
    manifest_parse recorded. Reports coverage as prominently as the count — DECLARED dependencies only,
    so a zero is 'none found in what we can see', not 'none exist'.
- question: Is there any existing use within our organization?
  stage: Discovery
  perspectives:
  - Consumer
  - App/AI Builder
  - Privacy
  - Community
  - Data Expert
  - Security
  - Architecture
  - Admin
  purposes:
  - Explore
  - Select
  answering:
    kind: direct
    analysis_ids: []
    checks: []
    note: N/A — RE registry query (already-registered repos/groups) - probably a set of egeria queries.
  answering_mechanism: Local Registry Query + Egeria Queries
  rationale: Answerable locally from RE's own registry (cross-reference against already-registered repos/groups)
    — no external API needed.
- question: Any known feedback?
  stage: Discovery
  perspectives:
  - Consumer
  - App/AI Builder
  - Community
  - Data Expert
  - Security
  - Architecture
  - Admin
  purposes:
  - Explore
  - Select
  answering:
    kind: direct
    analysis_ids: []
    checks: []
    note: N/A — direct field (resource_feedback table) - result from Egeriq queries/report
  answering_mechanism: Local Registry Query + Egeria Queries
  rationale: RE's Curate intent already holds resource_feedback for cataloged resources.
- question: Does it replace or extend something we already have?
  stage: Discovery
  perspectives:
  - Financial
  - Data Expert
  - Architecture
  purposes:
  - Select
  answering:
    kind: direct
    analysis_ids: []
    checks: []
    note: N/A — RE registry query (already-registered repos/groups) - might need RAG support for this.
  answering_mechanism: Local Registry Query + RAG Queries
  rationale: Answerable locally from RE's own registry/groups, same as "existing use within our organization."
- question: What are similar repos/projects? How does this differ?
  stage: Analysis
  perspectives:
  - Community
  - Security
  - Admin
  purposes:
  - Select
  answering:
    kind: gap
    analysis_ids: []
    checks: []
    note: 'GAP: similarity search over pgvector embeddings (not built) - Agent over RAG'
  answering_mechanism: Agent-Based Analysis
  rationale: Needs similarity search over content (RAG/embeddings) — real gap, not built.
- question: Are there any restrictions for use?
  stage: Analysis
  perspectives:
  - Security
  - Architecture
  - Admin
  purposes:
  - Select
  - Certify
  answering:
    kind: direct
    analysis_ids: []
    checks: []
    note: N/A — direct field (GitHub license field) - Also Agent over RAG? Direct field (GitHub license
      field) for a standard license (e.g. Apache 2.0) — the answer for those is itself usually just "citation/attribution
      required". A non-standard license needs the actual license text interpreted, which is where Agent-Based
      Analysis comes in instead of a direct-field read.
  answering_mechanism: Direct Field (standard license) + Agent-Based Analysis (non-standard license interpretation)
  rationale: License field is cheaply available from the GitHub API — deeper copyleft-risk categorization
    is Assessment-tier (see the license-specifics row below).
- question: What dependencies does this require?
  stage: Analysis
  perspectives:
  - Consumer
  - Data Expert
  - Security
  - Admin
  purposes:
  - Select
  - Assess
  - Deploy
  answering:
    kind: analysis
    analysis_ids:
    - dependency_analysis
    checks: []
    note: dependency_analysis
  answering_mechanism: Code Analysis
  rationale: DependencySurveyor exists (Analysis-tier) — dependency list per ecosystem.
- question: Do we already support these dependencies?
  stage: Analysis
  perspectives:
  - Security
  - Architecture
  - Admin
  purposes:
  - Select
  - Deploy
  answering:
    kind: human
    analysis_ids: []
    checks: []
    note: N/A — human-supplied via Enrichment Context form - may also be a new Agent over RAG content.
      Cross-reference against Egeria's catalog of already-supported dependencies, validated/completed
      by human input — likely needs a per-dependency answer, not one blanket answer for the whole question.
  answering_mechanism: Egeria Queries + Human-Supplied
  rationale: Needs the org's own tech inventory — human-supplied cross-reference, not resource-derivable.
- question: What deployment styles does this support?
  stage: Analysis
  perspectives:
  - Security
  - Architecture
  - Admin
  purposes:
  - Select
  - Deploy
  answering:
    kind: mixed
    analysis_ids:
    - repo_conventions
    checks:
    - repo_conventions:deployment_docker
    note: 'MIXED: repo_conventions (deployment_docker presence signal); GAP: RAG content read for deployment
      instructions [checks: repo_conventions:deployment_docker]'
  answering_mechanism: Code Analysis + RAG Queries
  rationale: Presence of Dockerfile/compose/Helm chart is now a cheap Discovery-tier signal (repo_conventions'
    deployment_docker check); actual deployment *instructions* still need content read (Dockerfile, deployment
    docs) — RAG-tier, real gap.
- question: Do we know what the cost to run it is?
  stage: Analysis
  perspectives:
  - Financial
  - Admin
  purposes:
  - Select
  - Deploy
  answering:
    kind: human
    analysis_ids: []
    checks: []
    note: N/A — human-supplied via Enrichment Context form = may also be Agent over RAG content.
  answering_mechanism: Human-Supplied
  rationale: Human-supplied/derived — not resource-derivable.
- question: Is there a validation / deployment test for it?
  stage: Analysis
  perspectives:
  - Security
  - Admin
  purposes:
  - Assess
  - Deploy
  answering:
    kind: mixed
    analysis_ids:
    - ci_quality
    - repo_conventions
    checks:
    - ci_quality:ci_runs_tests
    - repo_conventions:deployment_docker
    note: 'MIXED: ci_quality (CI actually runs tests) + repo_conventions (deployment_docker evidence);
      GAP: real deployment-validation test - May be RAG queries? ci_quality/repo_conventions give structured
      signals; an Agent examining the repo''s actual file/directory structure (test dirs, validation scripts)
      can find hints beyond those fixed checks. [checks: ci_quality:ci_runs_tests, repo_conventions:deployment_docker]'
  answering_mechanism: Code Analysis + Agent-Based Analysis
  rationale: ci_quality checks whether CI workflows actually run tests (not just exist); repo_conventions'
    deployment_docker adds deployment-evidence signal — together a much better fit than CI-config-presence
    alone; a real deployment *validation* test is still a gap.
- question: What is the upgrade process?
  stage: Analysis
  perspectives:
  - Consumer
  - Data Expert
  - Architecture
  - Admin
  purposes:
  - Maintain
  - Deploy
  answering:
    kind: gap
    analysis_ids: []
    checks: []
    note: 'GAP: RAG content read (CHANGELOG/release notes) — no structured surveyor'
  answering_mechanism: RAG Queries
  rationale: Needs content read (CHANGELOG, release notes) — RAG-tier, real gap.
- question: Does it fit into our monitoring infrastructure?
  stage: Analysis/Enrichment
  perspectives:
  - Data Owner
  - Consumer
  - Architecture
  - Admin
  purposes:
  - Deploy
  - Maintain
  answering:
    kind: human
    analysis_ids: []
    checks: []
    note: N/A — human-supplied via Enrichment Context form - We may be able to use targeted Egeria queries
      first - augmented with enrichment.
  answering_mechanism: Egeria Queries + Human-Supplied
  rationale: Org-internal cross-reference — human-supplied.
- question: Does it fit into our security infrastructure?
  stage: Analysis/Enrichment
  perspectives:
  - Financial
  - Data Owner
  - Consumer
  - App/AI Builder
  - Security
  - Architecture
  - Admin
  purposes:
  - Assess
  - Deploy
  answering:
    kind: human
    analysis_ids:
    - security_scan
    checks: []
    note: N/A — human-supplied via Enrichment Context form, informed by security_scan findings and Egeria
      queries.
  answering_mechanism: Code Analysis + Egeria Queries + Human-Supplied
  rationale: Org-internal cross-reference, informed by Assessment's security findings.
- question: Is there any reliability or availability aspects?
  stage: Analysis
  perspectives:
  - Security
  - Architecture
  - Admin
  purposes:
  - Select
  - Maintain
  answering:
    kind: chart
    analysis_ids: []
    checks: []
    note: N/A — Understanding trend chart (stats.py, project_stats history); GAP if SLA-doc content read
      is needed instead. May require RAG search.
  answering_mechanism: Trend Chart
  rationale: Trend/uptime signal, if available — Understanding-tier chart, or Analysis if content-derived
    (SLA docs).
- question: What kinds of integrations does it support?
  stage: Analysis
  perspectives:
  - Consumer
  - Data Expert
  - Security
  - Architecture
  - Admin
  purposes:
  - Select
  - Deploy
  answering:
    kind: partial
    analysis_ids:
    - interface_surface
    checks: []
    note: 'PARTIAL: interface_surface (what can be talked to, and whether the contract is written down
      — from the file inventory and declared dependencies); GAP remains for the prose read of integration
      guides'
  answering_mechanism: Code Analysis + RAG Queries
  rationale: interface_surface answers the structural half — which interfaces exist and whether they are
    documented. Which named third-party systems it integrates with still needs a content read and has
    no surveyor.
- question: Does this fit within or need to extend our existing infrastructure estate?
  stage: Analysis/Enrichment
  perspectives:
  - Consumer
  - Security
  - Architecture
  - Admin
  purposes:
  - Select
  - Deploy
  answering:
    kind: human
    analysis_ids: []
    checks: []
    note: N/A — human-supplied via Enrichment Context form with as fallback from Egeria queries.
  answering_mechanism: Human-Supplied + Egeria Queries
  rationale: Org-internal cross-reference — human-supplied.
- question: How mature is it?
  stage: Assessment
  perspectives:
  - Community
  - Data Expert
  - Architecture
  - Admin
  purposes:
  - Select
  - Assess
  answering:
    kind: mixed
    analysis_ids:
    - maturity
    checks:
    - maturity:project_maturity
    note: 'MIXED: maturity (direct classification) + Understanding trend chart (stats.py, project_stats
      history) [checks: maturity:project_maturity]'
  answering_mechanism: Code Analysis
  rationale: Direct lifecycle-stage classification (nascent/emerging/established/mature) from repo_created_at,
    CHAOSS-informed (the maturity analysis) — a more direct answer than the age/release-cadence trend
    chart alone, which remains a secondary Understanding-tier view of the same underlying signal.
- question: Do we have the skills to support its use?
  stage: Analysis/Enrichment
  perspectives:
  - Security
  - Architecture
  - Admin
  purposes:
  - Select
  - Learn
  answering:
    kind: human
    analysis_ids: []
    checks: []
    note: N/A — human-supplied via Enrichment Context form - Egeria queries as well
  answering_mechanism: Human-Supplied + Egeria Queries
  rationale: Purely human-supplied — never resource-derivable.
- question: How well documented is it?
  stage: Analysis
  perspectives:
  - Consumer
  - Community
  - Data Expert
  - Architecture
  - Admin
  purposes:
  - Select
  - Learn
  - Share
  answering:
    kind: mixed
    analysis_ids:
    - documentation_coverage
    - repo_conventions
    checks:
    - repo_conventions:doc_breadth
    note: 'MIXED: documentation_coverage + repo_conventions (doc_breadth) perhaps also an Agent? documentation_coverage/repo_conventions
      give structured presence signals; an Agent reviewing the whole set (READMEs in every folder, a separate
      docs directory, tutorials, etc.) can judge documentation quality more holistically than presence-checks
      alone. [checks: repo_conventions:doc_breadth]'
  answering_mechanism: Code Analysis + Agent-Based Analysis
  rationale: documentation_coverage checks root README/CHANGELOG/CONTRIBUTING presence + quality label;
    repo_conventions' doc_breadth adds a whole-tree density signal (README count, docs/ folder, .md/.txt
    count) that the root-only check misses.
- question: How is it supported?
  stage: Analysis
  perspectives:
  - Financial
  - Consumer
  - Data Expert
  - Architecture
  - Admin
  purposes:
  - Select
  - Maintain
  answering:
    kind: mixed
    analysis_ids:
    - repository_health
    - documentation_coverage
    - sla_content
    checks: []
    note: 'MIXED: repository_health (community responsiveness) + documentation_coverage + sla_content
      (published support commitments)'
  answering_mechanism: Git Statistics + Code Analysis
  rationale: 'Mixed: community responsiveness (Scouting-cheap) + documentation quality (Assessment) +
    any formal support docs (Analysis/RAG).'
- question: Is there a current, published, security analysis?
  stage: Analysis
  perspectives:
  - Governance
  - Security
  - Architecture
  - Admin
  purposes:
  - Assess
  - Certify
  answering:
    kind: mixed
    analysis_ids:
    - security_scan
    - chaoss_metrics
    - cii_badge
    - foss_scorecard
    - security_features
    - repo_conventions
    checks: []
    note: 'MIXED: cii_badge (the real OpenSSF Best Practices badge, read from bestpractices.dev) + foss_scorecard
      (OpenSSF-Scorecard-shaped checks computed locally, NOT the upstream tool''s own run) + chaoss_metrics;
      security_scan + security_features + repo_conventions for hygiene signals'
  answering_mechanism: External Service Query + Code Analysis
  rationale: 'The GAP note here named OpenSSF Scorecard and CHAOSS as candidate tooling; both landed 2026-08-26
    as foss_scorecard and chaoss_metrics, and cii_badge reads the real published badge. Still MIXED rather
    than answered: a published third-party audit is a different artifact from any of these, and nothing
    detects one.'
- question: Does it fit into our governance frameworks?
  stage: Analysis/Enrichment
  perspectives:
  - Governance
  - Security
  - Architecture
  - Admin
  purposes:
  - Certify
  - Share
  answering:
    kind: human
    analysis_ids: []
    checks: []
    note: N/A — human-supplied via Enrichment Context form, plus Curate zone/catalog membership (egeria_publish),
      plus Egeria queries.
  answering_mechanism: Human-Supplied + Egeria Queries
  rationale: Org policy cross-reference (human-supplied), plus Curate's zone/catalog membership once published.
- question: What explicit license does the repository use, and are there non-standard or copyleft terms?
  stage: Assessment
  perspectives:
  - Financial
  - Data Owner
  - App/AI Builder
  - Security
  purposes:
  - Select
  - Certify
  answering:
    kind: analysis
    analysis_ids:
    - license_classification
    checks:
    - license_classification:license_risk_tier
    note: 'license_classification [checks: license_classification:license_risk_tier]'
  answering_mechanism: Code Analysis
  rationale: 'GitHub API license field gives the SPDX id cheaply (Scouting); license_classification (Assessment)
    categorizes it into a risk tier (permissive/weak copyleft/strong copyleft/source-available/unknown)
    — candidate reference tools for deeper provenance: FOSSology (Linux Foundation compliance workspace),
    LicenseFinder, ClearlyDefined (crowdsourced licensing/provenance data), Mend, Black Duck. SPDX (ISO/IEC
    5962) is the standard schema this conforms to.'
- question: Is intellectual property (IP) provenance managed via CLA or DCO?
  stage: Analysis
  perspectives:
  - Financial
  - Governance
  - Steward
  - Data Owner
  - Security
  purposes:
  - Select
  - Certify
  answering:
    kind: analysis
    analysis_ids:
    - contribution_provenance
    checks: []
    note: contribution_provenance
  answering_mechanism: Code Analysis
  rationale: contribution_provenance detects CLA/DCO signals — DCO sign-off in commit trailers, CLA bot
    configuration, and CONTRIBUTING.md statements — and reports which mechanism is in use rather than
    a yes/no. Was marked GAP until 2026-09-02; the analysis shipped 2026-09-01 and the row was never updated.
- question: Does the software contain telemetry, phone-home mechanisms, or external metrics tracking?
  stage: Analysis
  perspectives:
  - Privacy
  - Security
  - Architecture
  - Admin
  purposes:
  - Assess
  - Certify
  answering:
    kind: analysis
    analysis_ids:
    - telemetry_scan
    checks: []
    note: telemetry_scan
  answering_mechanism: Code Analysis
  rationale: telemetry_scan matches known telemetry/analytics SDK imports and endpoints against source,
    and separately checks whether any match is disclosed in the repo's own docs — an undisclosed match
    is the finding, not the presence of telemetry. Was marked GAP until 2026-09-02; the analysis shipped
    2026-09-01.
- question: For AI/ML assets, what licensing or usage constraints apply to models, weights, or datasets?
  stage: Analysis
  perspectives:
  - Governance
  - App/AI Builder
  - Privacy
  - Data Expert
  purposes:
  - Select
  - Certify
  answering:
    kind: gap
    analysis_ids: []
    checks: []
    note: 'GAP: model-card/dataset-file detection (AI Governance tooling category)'
  answering_mechanism: Gap
  rationale: Needs model-card/dataset-file detection — real gap, AI Governance tooling category.
- question: How does the repository handle secrets, credentials, and sensitive configurations?
  stage: Analysis
  perspectives:
  - Security
  - Architecture
  - Admin
  purposes:
  - Assess
  - Certify
  answering:
    kind: analysis
    analysis_ids:
    - secret_scan
    checks: []
    note: secret_scan
  answering_mechanism: Code Analysis
  rationale: secret_scan runs a vendored gitleaks ruleset over the HEAD snapshot of tracked files, reporting
    which ruleset and commit produced the result. Never claims 'no secrets' — only 'no matches against
    this ruleset, in this snapshot' — and says nothing about git history, where a removed secret still
    lives. Was marked GAP until 2026-09-02; the analysis shipped 2026-09-01.
- question: Does the repository publish a clear process for reporting security vulnerabilities?
  stage: Analysis
  perspectives:
  - Governance
  - Security
  purposes:
  - Certify
  answering:
    kind: analysis
    analysis_ids:
    - security_scan
    - repo_conventions
    checks:
    - repo_conventions:security_policy_content
    note: 'repo_conventions + security_scan [checks: repo_conventions:security_policy_content]'
  answering_mechanism: Code Analysis
  rationale: repo_conventions reads SECURITY.md's CONTENT (is there an actual disclosure process, not
    just a file); security_scan's hygiene check reports the file's presence. The row read 'repo_conventions
    - RAG read?', which the generator could not parse into a kind, so the question was unanswerable despite
    being correctly wired.
- question: Does the repository have automated build tooling in place?
  stage: Analysis
  perspectives:
  - App/AI Builder
  - Architecture
  purposes:
  - Certify
  - Deploy
  answering:
    kind: analysis
    analysis_ids:
    - ci_quality
    - repo_conventions
    checks:
    - repo_conventions:automated_build
    note: 'repo_conventions + ci_quality [checks: repo_conventions:automated_build]'
  answering_mechanism: Code Analysis

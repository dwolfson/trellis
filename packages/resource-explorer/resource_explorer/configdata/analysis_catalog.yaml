# Externalized analysis catalog — the menu of analyses available per
# resource type, shown in the Assessment/Analysis/Curate intent panes and
# used by the scheduler (resource_explorer/scheduler.py) to run analyses
# on a cadence.
#
# This is the local counterpart to Egeria's find_technology_types /
# get_tech_type_detail. The two ARE merged at read time —
# resource_explorer/surveyors/analysis_catalog_reader.py optionally calls
# EgeriaTechTypeCatalog.get_produced_annotation_types() and appends
# Egeria-native entries alongside these local ones (fail-soft: if Egeria
# is unreachable, only the local entries below are returned).
#
# IMPORTANT — intent values: this catalog uses the FULL 7-intent scheme
# (scouting / assessment / discovery / analysis / enrichment /
# understanding / curate), which supersedes the 4-intent list still
# documented in this package's CLAUDE.md as of this writing (Scouting /
# Assessment / Discovery / Enrichment only) — update that doc's "Four User
# Intents" section to match once the intent-shell UI work is complete.
# 'discovery' and 'enrichment' currently have zero entries here by design:
# Discovery is served entirely by survey_definitions.py (the Survey
# Definition / GovernanceActionProcess catalog), and Enrichment by
# context.py + activity.py (human-provided context, RFA response) — not
# by this analysis menu. That's not an oversight.
#
# Each entry fields:
#   id               - stable identifier; referenced by resource_schedules
#                       rows (scheduler.py) and must never change once an
#                       analysis has been scheduled anywhere.
#   name, description - shown in the UI card.
#   resource_types    - which of repo/database/filesystem this applies to.
#   intent            - one of the 7 canonical intents (see above).
#   perspectives      - persona tags; "all" plus zero or more of
#                       dba/data_scientist/steward/security. Concurrent
#                       multi-select in the UI, OR-matched.
#   annotation_types  - Egeria annotation type names this analysis produces
#                       when run (used for cross-referencing, not enforced).
#   source            - "local" (RE's own surveyors) or "egeria" (native
#                       Egeria survey/catalog action).
#   run_time          - fast | minutes | async — UI speed badge.
#   action            - "survey" (read-only analysis) or "publish" (writes
#                       to the Egeria catalog of record).
#   target_shape      - repo scope-narrowing funnel plan (docs/repo-scope-
#                       narrowing-funnel.md), D5/D6 — what shape of target
#                       this analysis can mechanically operate on if scope
#                       is narrowed below "the whole resource":
#                         corpus             - the whole resource, or any
#                                              container + everything
#                                              recursively below it (a
#                                              path-prefix filter).
#                         single_container   - a real hierarchy exists
#                                              (e.g. database schema->table)
#                                              but doesn't recurse
#                                              arbitrarily deep.
#                         whole_resource_only - the data is inherently one
#                                              aggregate for the whole
#                                              resource; narrowing it is a
#                                              different analysis, not a
#                                              query change.
#                       Grounded in a real code audit (see that doc's
#                       "Target-shape inventory"), not guessed — RE's own
#                       best judgment, not gospel; a new analysis kind
#                       declares its own shape here, no Python change
#                       needed elsewhere for the compatibility check to
#                       pick it up. Mixed-output kinds take their single
#                       most-restrictive shape (simplicity over per-output
#                       tagging, until real friction shows up).
#   recommended       - shown with a ★ star as a suggested starting point.
#   egeria_registration - schema-only hook for eventual GovernanceActionType
#                       registration of this analysis as a native Egeria
#                       action. NOT a registration mechanism — just a place
#                       to record whether one exists/is planned, and if so
#                       which (entity_type, technology_type) pair it maps
#                       to in technology_type_processes.yaml.
#     candidate         - bool, is this a realistic candidate for Egeria
#                         native registration.
#     native_process_ref - [entity_type, technology_type_name] pointing into
#                         technology_type_processes.yaml, or null if no
#                         confirmed native process exists yet. Never guess
#                         this string — only set it once confirmed live via
#                         find_governance_definitions, same rule as that
#                         file's own header comment.

repo_analyses:
  - id: language_file_classification
    name: "Language & File Classification"
    description: "Identify programming languages, file types, and project structure. Produces file-type counts and language breakdown."
    resource_types: ["repo"]
    intent: scouting
    perspectives: ["all"]
    annotation_types: ["ResourceMeasureAnnotation", "ClassificationAnnotation"]
    source: local
    run_time: fast
    action: survey
    target_shape: whole_resource_only
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: repository_health
    name: "Repository Health"
    description: "Stars, forks, contributors, open issues, and activity metrics from GitHub. Produces a quality score annotation."
    resource_types: ["repo"]
    intent: scouting
    perspectives: ["all"]
    annotation_types: ["QualityScoreAnnotation"]
    source: local
    run_time: fast
    action: survey
    target_shape: whole_resource_only
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: dependency_analysis
    name: "Dependency Analysis"
    description: "Scan package manifests (pyproject.toml, package.json, pom.xml, etc.) for dependencies by ecosystem."
    resource_types: ["repo"]
    intent: analysis  # was 'assessment' — structural/quantitative, not a scored evaluation
    perspectives: ["all", "security"]
    annotation_types: ["DataClassAnnotation"]
    source: local
    run_time: fast
    action: survey
    target_shape: whole_resource_only
    recommended: false
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: security_scan
    name: "Security Scan"
    description: "Detect hardcoded secrets, insecure patterns, and missing security artifacts (SECURITY.md, signed commits)."
    resource_types: ["repo"]
    intent: assessment  # true scoring against criteria — unchanged
    perspectives: ["security", "steward"]
    annotation_types: ["RequestForActionAnnotation"]
    source: local
    run_time: fast
    action: survey
    target_shape: whole_resource_only
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: documentation_coverage
    name: "Documentation Coverage"
    description: "Assess README completeness, CHANGELOG, API docs, and inline comment coverage."
    resource_types: ["repo"]
    intent: assessment  # scores completeness against a checklist — unchanged
    perspectives: ["steward", "all"]
    annotation_types: ["ClassificationAnnotation"]
    source: local
    run_time: fast
    action: survey
    target_shape: whole_resource_only
    recommended: false
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: license_classification
    name: "License Classification"
    description: "Classify the repo's SPDX license id into a risk tier (permissive/weak copyleft/strong copyleft/source-available/unknown)."
    resource_types: ["repo"]
    intent: discovery  # retagged from 'assessment' 2026-08-20: Discovery is derivation over already-collected data (zero new fetch), not where a survey happens to be launched from. All three of this tier's analyses declare requires_resources={} — they reason over project_stats/file inventory that Scouting already gathered, and exist to decide whether the expensive tiers are worth paying for. See CLAUDE.md rule 17.  # is this worth pursuing, given its usage restrictions?
    perspectives: ["steward", "security", "all"]
    annotation_types: ["ClassificationAnnotation"]
    source: local
    run_time: fast
    action: survey
    target_shape: whole_resource_only
    recommended: false
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: security_features
    name: "Security Features"
    description: "GitHub's native security feature toggles (Dependabot, secret scanning, advanced security) — configuration state, not artifact presence."
    resource_types: ["repo"]
    intent: assessment  # true scoring against criteria — same family as security_scan
    perspectives: ["security", "steward"]
    annotation_types: ["ClassificationAnnotation"]
    source: local
    run_time: fast
    action: survey
    target_shape: whole_resource_only
    recommended: false
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: ci_quality
    name: "CI Quality"
    description: "Whether CI workflows actually run tests/lint/build (keyword scan of workflow content), not just whether a CI config file exists."
    resource_types: ["repo"]
    intent: assessment  # true scoring against criteria — same family as security_scan
    perspectives: ["steward", "security", "all"]
    annotation_types: ["ClassificationAnnotation"]
    source: local
    run_time: fast
    action: survey
    target_shape: whole_resource_only
    recommended: false
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: maturity
    name: "Maturity"
    description: "Project age/lifecycle stage (nascent/emerging/established/mature) from repo creation date — a CHAOSS-informed early-headlights signal, distinct from Repository Health's activity/community/release scoring."
    resource_types: ["repo"]
    intent: discovery  # retagged from 'assessment' 2026-08-20 — see CLAUDE.md rule 17.
    perspectives: ["steward", "all"]
    annotation_types: ["ClassificationAnnotation"]
    source: local
    run_time: fast
    action: survey
    target_shape: whole_resource_only
    recommended: false
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: repo_conventions
    name: "Repo Conventions"
    description: "Discovery-tier repo conventions: security policy content, build automation, deployment/Docker evidence, catalog self-description (Backstage-style catalog-info.yaml), documentation breadth."
    resource_types: ["repo"]
    intent: discovery  # retagged from 'assessment' 2026-08-20 — see CLAUDE.md rule 17.
    perspectives: ["steward", "security", "all"]
    annotation_types: ["ClassificationAnnotation"]
    source: local
    run_time: fast
    action: survey
    target_shape: whole_resource_only
    recommended: false
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: data_file_profiling
    name: "Data File Profiling"
    description: "Profile CSV, Excel, Parquet, and other tabular data files for schema, row counts, and null statistics."
    resource_types: ["repo"]
    intent: analysis  # was 'assessment' — structural profiling, baseline for change-detection
    perspectives: ["data_scientist", "steward"]
    annotation_types: ["SchemaAnalysisAnnotation", "DataClassAnnotation"]
    source: local
    run_time: minutes
    action: survey
    target_shape: corpus
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: sub_resource_survey
    name: "Sub-resource Survey"
    description: "Walk the file inventory to recommend which top-level folders and well-known files are worthy of becoming their own Egeria asset, with size/mode/ownership metadata tiered by cost."
    resource_types: ["repo"]
    # analysis, not assessment: it produces a structural recommendation about
    # what the repo *contains* and how it is shaped, not a scored judgement of
    # quality. It was absent from this catalog entirely until 2026-08-20, which
    # meant it carried no intent — and since Survey Results dashboards derive
    # their stage from the intents of their analyses, data_profile was placed on
    # the strength of data_file_profiling alone and this analysis was invisible
    # to stage routing.
    intent: analysis
    perspectives: ["steward", "data_scientist", "all"]
    annotation_types: ["ClassificationAnnotation", "ResourceMeasureAnnotation"]
    source: local
    run_time: fast
    action: survey
    target_shape: corpus
    native_process_ref: null

  - id: api_structure
    name: "API & Symbol Extraction"
    description: "Extract public functions, classes, and API endpoints from Python, JavaScript, and OpenAPI source."
    resource_types: ["repo"]
    intent: analysis  # was 'assessment' — structural extraction, not evaluative
    perspectives: ["data_scientist", "all"]
    annotation_types: ["SchemaAnalysisAnnotation"]
    source: local
    run_time: fast
    action: survey
    target_shape: corpus
    recommended: false
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: code_symbol_extraction
    name: "Refresh Code Symbols"
    description: "Extract class/function/method symbols (tree-sitter/AST) for every supported language and refresh the code-symbol index — the self-contained refresh 'API & Symbol Extraction' and any future consumer read from. Independently runnable/schedulable so symbols stay current even for repos that skip RAG ingestion."
    resource_types: ["repo"]
    intent: analysis
    perspectives: ["data_scientist", "all"]
    annotation_types: ["ResourceMeasureAnnotation"]
    source: local
    run_time: fast
    action: survey
    target_shape: whole_resource_only
    recommended: false
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: architecture_recovery
    name: "Architecture Recovery"
    description: "Recover candidate architecture components from package manifests, deployment units (Dockerfile/compose), ast-grep code markers, and import/co-change coupling — a component partition proposal with confidence and evidence, not a published blueprint (docs/architecture-recovery-phase1-plan.md)."
    resource_types: ["repo"]
    # Retagged to discovery 2026-08-22 (maintainer's ruling) — the stored
    # candidate hierarchy (approach-portfolio-model.md §2a) is comfortably
    # sufficient for "which subsystem is this?" (a coarse projection, see
    # projection.py), marginal for component-scoped metrics, and nowhere
    # near publishable. NOTE the tension this leaves with CLAUDE.md rule
    # 17's collect-vs-reason axis: both repo_arch_detect (zipball_root) and
    # repo_arch_coupling (zipball_root + git_clone_root) DO fetch fresh
    # data, unlike every other discovery-tier analysis, which is zero-fetch
    # by construction. Recorded rather than quietly reconciled — the
    # maintainer's call was explicit and is not this comment's to override.
    intent: discovery
    perspectives: ["all"]
    annotation_types: ["ResourceMeasureAnnotation", "RequestForActionAnnotation"]
    source: local
    run_time: fast
    action: survey
    target_shape: corpus
    recommended: false
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: repo_profile_refresh
    name: "Refresh Coarse Profile"
    description: "Download the repo's zipball once and refresh file inventory and data-file profiles (optionally also code symbols) — decoupled from pgvector re-ingestion. Backs Scouting's Coarse Profile tab."
    resource_types: ["repo"]
    intent: scouting
    perspectives: ["all"]
    annotation_types: []
    source: local
    run_time: minutes
    action: profile
    target_shape: whole_resource_only
    recommended: false
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: rag_ingestion
    name: "Refresh & Re-ingest"
    description: "Pull the latest commits and re-embed changed content into pgvector (incremental, commit-diff based). Keeps chat/RAG answers current with the repo."
    resource_types: ["repo"]
    intent: analysis
    perspectives: ["all"]
    annotation_types: []
    source: local
    run_time: minutes
    action: ingest
    target_shape: whole_resource_only
    recommended: false
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: website_ingestion
    name: "Ingest Documentation Site"
    description: "Embed the project's documentation site into pgvector so Chat and Understanding can answer from what the project says about itself, not only from its source tree. Collapses versioned docs to the current release. Skips when the repo builds that site itself — the source is already ingested in a better form."
    resource_types: ["repo"]
    intent: analysis
    perspectives: ["all"]
    annotation_types: ["ResourceMeasureAnnotation"]
    source: local
    run_time: minutes
    action: ingest
    target_shape: whole_resource_only
    recommended: false
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: egeria_publish
    name: "Publish to Egeria Catalog"
    description: "Register the repository in Egeria and publish all survey annotations as a SurveyReport asset. Requires Egeria connection."
    resource_types: ["repo"]
    intent: curate  # was 'assessment' — action:"publish" is an explicit catalog-of-record write
    perspectives: ["steward", "all"]
    annotation_types: ["SurveyReport"]
    source: egeria
    run_time: minutes
    action: publish
    target_shape: whole_resource_only
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null  # no confirmed native Egeria process for generic repo publish

database_analyses:
  - id: schema_inventory
    name: "Schema Inventory"
    description: "List all schemas, tables, columns with types, constraints, primary keys, foreign keys, and comments."
    resource_types: ["database"]
    intent: scouting
    perspectives: ["all", "dba"]
    annotation_types: ["SchemaAnalysisAnnotation", "ResourceMeasureAnnotation"]
    source: local
    run_time: fast
    action: survey
    target_shape: single_container
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: row_count_snapshot
    name: "Row Count Snapshot"
    description: "Count rows in all tables using pg_stat_user_tables. Records a time-series data point for trend analysis."
    resource_types: ["database"]
    intent: scouting
    perspectives: ["all", "dba"]
    annotation_types: ["ResourceMeasureAnnotation"]
    source: local
    run_time: fast
    action: survey
    target_shape: corpus
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: privilege_audit
    name: "Privilege Audit"
    description: "Review database roles, grants, and superuser accounts for security hygiene."
    resource_types: ["database"]
    intent: assessment  # scores grant/role hygiene — unchanged
    perspectives: ["security", "dba"]
    annotation_types: ["DataClassAnnotation", "RequestForActionAnnotation"]
    source: local
    run_time: fast
    action: survey
    target_shape: whole_resource_only
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: egeria_db_survey
    name: "Egeria Native DB Survey"
    description: "Trigger Egeria's native PostgreSQL survey for deep annotation of schema, data quality, and lineage. Runs asynchronously."
    resource_types: ["database"]
    intent: curate  # was 'assessment' — action:"publish" is an explicit catalog-of-record write
    perspectives: ["all", "dba"]
    annotation_types: ["SchemaAnalysisAnnotation", "ClassificationAnnotation", "RequestForActionAnnotation"]
    source: egeria
    run_time: async
    action: publish
    target_shape: whole_resource_only
    recommended: true
    egeria_registration:
      candidate: true
      native_process_ref: ["database", "PostgreSQL Relational Database"]

filesystem_analyses:
  - id: filesystem_inventory
    name: "File System Inventory"
    description: "Walks the filesystem, collects file sizes, formats, timestamps, and classifications. Profiles tabular data file schemas."
    resource_types: ["filesystem"]
    intent: scouting
    perspectives: ["all", "steward"]
    annotation_types:
      - ResourceMeasureAnnotation
      - ClassificationAnnotation
      - RequestForActionAnnotation
      - SchemaAnalysisAnnotation
    source: local
    run_time: minutes
    action: survey
    target_shape: corpus
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null

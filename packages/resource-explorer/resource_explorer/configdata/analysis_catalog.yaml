  - id: maturity
    name: "Maturity"
    description: "Project age/lifecycle stage (nascent/emerging/established/mature) from repo creation date — a CHAOSS-informed early-headlights signal, distinct from Repository Health's activity/community/release scoring."
    resource_types: ["repo"]
    intent: discovery  # retagged from 'assessment' 2026-08-20 — see CLAUDE.md rule 17.
    perspectives: ["Steward", "all"]
    annotation_types: ["ClassificationAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: whole_resource_only
    recommended: false
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: repo_conventions
    name: "Repo Conventions"
    description: "Discovery-tier repo conventions: security policy content, build automation, deployment/Docker evidence, catalog self-description (Backstage-style catalog-info.yaml), documentation breadth."
    resource_types: ["repo"]
    intent: discovery  # retagged from 'assessment' 2026-08-20 — see CLAUDE.md rule 17.
    perspectives: ["Steward", "Security", "all"]
    annotation_types: ["ClassificationAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: whole_resource_only
    recommended: false
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: data_file_profiling
    name: "Data File Profiling"
    description: "Profile CSV, Excel, Parquet, and other tabular data files for schema, row counts, and null statistics."
    resource_types: ["repo"]
    intent: analysis  # was 'assessment' — structural profiling, baseline for change-detection
    perspectives: ["Data Expert", "Steward"]
    annotation_types: ["SchemaAnalysisAnnotation", "DataClassAnnotation"]
    source: local
    run_time: minutes
    # Queued STRUCTURALLY, not by omission: this acquires zipball_root, so a
    # context compile running it inline would download on its hot path.
    # Declared rather than left to default so "deliberately queued" is
    # distinguishable from "nobody has considered this yet".
    availability: queued
    action: survey
    target_shape: corpus
    recommended: true
    egeria_registration:
      candidate: false
      native_process_ref: null

  - id: sub_resource_survey
    name: "Sub-resource Survey"
    description: "Walk the file inventory to recommend which top-level folders and well-known files are worthy of becoming their own Egeria asset, with size/mode/ownership metadata tiered by cost."
    resource_types: ["repo"]
    # analysis, not assessment: it produces a structural recommendation about
    # what the repo *contains* and how it is shaped, not a scored judgement of
    # quality. It was absent from this catalog entirely until 2026-08-20, which
    # meant it carried no intent — and since Survey Results dashboards derive
    # their stage from the intents of their analyses, data_profile was placed on
    # the strength of data_file_profiling alone and this analysis was invisible
    # to stage routing.
    intent: analysis
    perspectives: ["Steward", "Data Expert", "all"]
    annotation_types: ["ClassificationAnnotation", "ResourceMeasureAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: corpus
    native_process_ref: null

  - id: api_structure
    name: "API & Symbol Extraction"
    description: "Extract public functions, classes, and API endpoints from Python, JavaScript, and OpenAPI source."
    resource_types: ["repo"]
    intent: analysis  # was 'assessment' — structural extraction, not evaluative
    perspectives: ["Data Expert", "all"]
    annotation_types: ["SchemaAnalysisAnnotation"]
    source: local
    run_time: fast
    availability: inline
    action: survey
    target_shape: corpus
    recommended: false
    egeria_registration:

[project]
name = "trellis-context"
version = "0.1.0"
description = "Context compilation — ContextSpec, and a deterministic packer that turns resolved sources into a bounded context plus a manifest saying what it did. See docs/context-compilation-design.md."
readme = "README.md"
authors = [{ name = "Dan Wolfson" }]
requires-python = ">=3.12,<4.0"
dependencies = [
    "trellis-artifact-tree",
]

# Deliberately NOT dependencies:
#
# - any LLM client. The packer is ordinary code and must stay that way: every
#   guarantee it offers (determinism, monotonicity, symmetry, the hard ceiling)
#   is unavailable the moment a model decides what to include.
# - a tokenizer. Budget is counted in characters here, with the model's own
#   tokenizer applied by the caller if it wants precision. Pulling tiktoken or
#   transformers in to count would make this package heavier than the thing it
#   is packing for.
# - psycopg2. Resolvers hand this package their results; it never reads a store.

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-cov>=5.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trellis_context"]
